name: Build aMuleD (static)

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'aMuleD'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 1 1,7 *'

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/amule-org/amule.git

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
            runner: ubuntu-24.04
            needs_qemu: true
            output_path: conf/aMule/aMuleDARMv7.bin
            state_path: conf/aMule/.aMuleDARMv7.upstream-commit
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            needs_qemu: false
            output_path: conf/aMule/aMuleDARM64.bin
            state_path: conf/aMule/.aMuleDARM64.upstream-commit
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone amule-org/amule
        run: git clone --depth=1 "${{ env.UPSTREAM_REPO }}" amule-src

      - name: Resolve upstream commit
        id: upstream
        run: |
          cd amule-src
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check if a rebuild is needed
        id: check
        run: |
          PREV=""
          if [ -f "${{ matrix.state_path }}" ]; then
            PREV="$(cat "${{ matrix.state_path }}")"
          fi
          CUR="${{ steps.upstream.outputs.sha }}"
          if [ "${PREV}" = "${CUR}" ] && [ "${{ inputs.force_rebuild }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true' && matrix.needs_qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Restore Docker layer cache
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/buildx-cache
          key: buildx-${{ matrix.arch }}-static-${{ hashFiles('amule-src/packaging/linux/versions.env') }}-${{ github.run_id }}
          restore-keys: |
            buildx-${{ matrix.arch }}-static-${{ hashFiles('amule-src/packaging/linux/versions.env') }}-
            buildx-${{ matrix.arch }}-static-

      - name: Load pinned dependency versions
        if: steps.check.outputs.skip != 'true'
        id: versions
        run: |
          set -a
          . amule-src/packaging/linux/versions.env
          set +a
          {
            echo "alpine_static_base=${ALPINE_STATIC_BASE}"
            echo "wx_version=${WX_VERSION}"
            echo "wx_tarball_url=${WX_TARBALL_URL}"
            echo "wx_sha256=${WX_SHA256}"
            echo "cryptopp_tag_suffix=${CRYPTOPP_TAG_SUFFIX}"
            echo "libupnp_version=${LIBUPNP_VERSION}"
            echo "libupnp_tarball_url=${LIBUPNP_TARBALL_URL}"
            echo "libupnp_sha256=${LIBUPNP_SHA256}"
          } >> "$GITHUB_OUTPUT"

      - name: Build static amuled
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p out /tmp/buildx-cache
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f amule-src/packaging/linux/static/Dockerfile \
            --build-arg "ALPINE_STATIC_BASE=${{ steps.versions.outputs.alpine_static_base }}" \
            --build-arg "WX_VERSION=${{ steps.versions.outputs.wx_version }}" \
            --build-arg "WX_TARBALL_URL=${{ steps.versions.outputs.wx_tarball_url }}" \
            --build-arg "WX_SHA256=${{ steps.versions.outputs.wx_sha256 }}" \
            --build-arg "CRYPTOPP_TAG_SUFFIX=${{ steps.versions.outputs.cryptopp_tag_suffix }}" \
            --build-arg "LIBUPNP_VERSION=${{ steps.versions.outputs.libupnp_version }}" \
            --build-arg "LIBUPNP_TARBALL_URL=${{ steps.versions.outputs.libupnp_tarball_url }}" \
            --build-arg "LIBUPNP_SHA256=${{ steps.versions.outputs.libupnp_sha256 }}" \
            --cache-from "type=local,src=/tmp/buildx-cache" \
            --cache-to "type=local,dest=/tmp/buildx-cache-new,mode=max" \
            --output "type=local,dest=out" \
            amule-src
          test -f out/amuled
          rm -rf /tmp/buildx-cache
          mv /tmp/buildx-cache-new /tmp/buildx-cache

      - name: Verify the binary
        if: steps.check.outputs.skip != 'true'
        run: |
          file out/amuled
          file out/amuled | grep -qi 'ARM' || { echo "::error::not an ARM binary"; exit 1; }
          file out/amuled | grep -qi 'statically linked' \
            || echo "::warning::'file' didn't report static linkage — verify manually if unsure."

      - name: Install into repo path
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p "$(dirname "${{ matrix.output_path }}")"
          cp out/amuled "${{ matrix.output_path }}"
          chmod +x "${{ matrix.output_path }}"
          echo "${{ steps.upstream.outputs.sha }}" > "${{ matrix.state_path }}"

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "${{ matrix.output_path }}" "${{ matrix.state_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update aMuleD ${{ matrix.arch }} (amule-org/amule@${{ steps.upstream.outputs.sha }})"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              sleep $((RANDOM % 10 + 1))
            done
          fi