

name: Build amuled armv7 (static)

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'armv7'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 1 1,7 *'

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/amule-org/amule.git
  OUTPUT_PATH: conf/aMule/aMuleDARMv7.AppImage
  STATE_PATH: conf/aMule/.aMuleDARMv7.upstream-commit

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone amule-org/amule (upstream source)
        run: git clone --depth=1 "${{ env.UPSTREAM_REPO }}" amule-src

      - name: Resolve upstream commit
        id: upstream
        run: |
          cd amule-src
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check if a rebuild is needed
        id: check
        run: |
          PREV=""
          if [ -f "${{ env.STATE_PATH }}" ]; then
            PREV="$(cat "${{ env.STATE_PATH }}")"
          fi
          CUR="${{ steps.upstream.outputs.sha }}"
          echo "Previous built commit: ${PREV:-<none>}"
          echo "Current upstream commit: ${CUR}"
          if [ "${PREV}" = "${CUR}" ] && [ "${{ inputs.force_rebuild }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged and force_rebuild not set — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (for linux/arm/v7 emulation)
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Load pinned dependency versions from upstream
        if: steps.check.outputs.skip != 'true'
        id: versions
        run: |

          set -a
          . amule-src/packaging/linux/versions.env
          set +a
          {
            echo "alpine_static_base=${ALPINE_STATIC_BASE}"
            echo "wx_version=${WX_VERSION}"
            echo "wx_tarball_url=${WX_TARBALL_URL}"
            echo "wx_sha256=${WX_SHA256}"
            echo "cryptopp_tag_suffix=${CRYPTOPP_TAG_SUFFIX}"
            echo "libupnp_version=${LIBUPNP_VERSION}"
            echo "libupnp_tarball_url=${LIBUPNP_TARBALL_URL}"
            echo "libupnp_sha256=${LIBUPNP_SHA256}"
          } >> "$GITHUB_OUTPUT"

      - name: Build static amuled for armv7 (musl, via buildx)
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p out
          docker buildx build \
            --platform linux/arm/v7 \
            -f amule-src/packaging/linux/static/Dockerfile \
            --build-arg "ALPINE_STATIC_BASE=${{ steps.versions.outputs.alpine_static_base }}" \
            --build-arg "WX_VERSION=${{ steps.versions.outputs.wx_version }}" \
            --build-arg "WX_TARBALL_URL=${{ steps.versions.outputs.wx_tarball_url }}" \
            --build-arg "WX_SHA256=${{ steps.versions.outputs.wx_sha256 }}" \
            --build-arg "CRYPTOPP_TAG_SUFFIX=${{ steps.versions.outputs.cryptopp_tag_suffix }}" \
            --build-arg "LIBUPNP_VERSION=${{ steps.versions.outputs.libupnp_version }}" \
            --build-arg "LIBUPNP_TARBALL_URL=${{ steps.versions.outputs.libupnp_tarball_url }}" \
            --build-arg "LIBUPNP_SHA256=${{ steps.versions.outputs.libupnp_sha256 }}" \
            --output "type=local,dest=out" \
            amule-src

          test -f out/amuled

      - name: Verify the binary is static armv7
        if: steps.check.outputs.skip != 'true'
        run: |
          file out/amuled
          file out/amuled | grep -qi 'ARM' || { echo "::error::not an ARM binary"; exit 1; }

          file out/amuled | grep -qi 'statically linked' \
            || echo "::warning::'file' didn't report static linkage — verify manually if unsure."

      - name: Install into repo path
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p "$(dirname "${{ env.OUTPUT_PATH }}")"
          cp out/amuled "${{ env.OUTPUT_PATH }}"
          chmod +x "${{ env.OUTPUT_PATH }}"
          echo "${{ steps.upstream.outputs.sha }}" > "${{ env.STATE_PATH }}"

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.OUTPUT_PATH }}" "${{ env.STATE_PATH }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update aMuleDARMv7 (amule-org/amule@${{ steps.upstream.outputs.sha }})"
            git push
          fi