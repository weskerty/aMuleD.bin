<script type="application/json" id="manifest">
{"id":"yt-dlp","name":"YT-DLP","icon":"📥","tab":false,"settings":true,"capabilities":["search","download"]}
</script>

<style>
.yt-engine-label{font-size:.65rem;opacity:.4;padding:4px 0 6px;text-transform:uppercase;letter-spacing:.04em}
</style>

<div id="yt-results"></div>

<script>
(function(){
  function ytFmt(s) {
    if (!s) return '';
    return Math.floor(s/60)+'m'+String(Math.floor(s%60)).padStart(2,'0')+'s';
  }
  function ytEsc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  async function ytDl(url, type, title, btn) {
    btn.disabled = true;
    try {
      await fetch('/api/yt-dlp/download', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({url, type, title})
      });
      toast('Descarga iniciada');
    } catch(e) { btn.disabled = false; alert('Error: '+e.message); }
  }

  function renderResults(groups) {
    const wrap = document.getElementById('yt-results');
    if (!wrap) return;
    if (!groups || !groups.length) {
      wrap.innerHTML = '<div class="ml-card"><div class="ml-empty">Sin resultados</div></div>';
      return;
    }
    wrap.innerHTML = groups.map(g =>
      '<div class="ml-card">'
      +'<div class="yt-engine-label">'+ytEsc(g.engine)+'</div>'
      +g.results.map(r =>
        '<div class="ml-item">'
        +'<div class="ml-item-name">'+ytEsc(r.title)+'</div>'
        +'<div class="ml-item-meta">'+(r.channel?ytEsc(r.channel)+' &nbsp;':'')+(r.duration?ytFmt(r.duration):'')+'</div>'
        +'<div class="ml-item-actions">'
        +'<button class="ml-btn-sm" onclick="(function(b){ytDl(\''+ytEsc(r.url)+'\',\'audio\',\''+ytEsc(r.title)+'\',b)})(this)">🎵 Audio</button>'
        +'<button class="ml-btn-sm" onclick="(function(b){ytDl(\''+ytEsc(r.url)+'\',\'video\',\''+ytEsc(r.title)+'\',b)})(this)">🎬 Video</button>'
        +'</div></div>'
      ).join('')
      +'</div>'
    ).join('');
  }

  function renderURL(url) {
    const wrap = document.getElementById('yt-results');
    if (!wrap) return;
    wrap.innerHTML = '<div class="ml-card"><div class="ml-item">'
      +'<div class="ml-item-name" style="font-size:.75rem;word-break:break-all">'+ytEsc(url)+'</div>'
      +'<div class="ml-item-actions">'
      +'<button class="ml-btn-sm" onclick="(function(b){ytDl(\''+ytEsc(url)+'\',\'audio\',\'\',b)})(this)">🎵 Audio</button>'
      +'<button class="ml-btn-sm" onclick="(function(b){ytDl(\''+ytEsc(url)+'\',\'video\',\'\',b)})(this)">🎬 Video</button>'
      +'</div></div></div>';
  }

  function notifyDone() {
    const wrap = document.getElementById('yt-results');
    const container = wrap?.closest('#search-plugin-wrap') || wrap?.parentElement;
    if (container) container.dispatchEvent(new CustomEvent('pluginSearchDone', { bubbles: true, detail: { id: 'yt-dlp' } }));
  }

  async function doSearch(query) {
    if (!query) return;
    const wrap = document.getElementById('yt-results');
    if (!wrap) return;
    const isURL = /^https?:\/\//.test(query);
    if (isURL) { renderURL(query); notifyDone(); return; }
    wrap.innerHTML = '<div class="ml-card"><div class="ml-empty">⌛ Buscando...</div></div>';
    try {
      const d = await fetch('/api/yt-dlp/search', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({query})
      }).then(r => r.json());
      renderResults(d.groups || []);
    } catch(e) {
      wrap.innerHTML = '<div class="ml-card"><div class="ml-empty">Error: '+ytEsc(e.message)+'</div></div>';
    }
    notifyDone();
  }

  const container = document.getElementById('yt-results')?.parentElement;
  if (container) {
    container.addEventListener('pluginSearch', e => doSearch(e.detail?.query || ''));
    const q = container.dataset?.query || '';
    if (q) doSearch(q);
  }

  window.ytDl = ytDl;
})();
</script>
